[package]
name = "piplo"
version = "0.1.0"
description = "Hold a shortcut, speak, get clean text in the app you were already using."
authors = ["codea"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "piplo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes `"transparent": true` actually transparent on
# macOS — without it the widget and menu render as opaque rectangles. It rules out
# the Mac App Store, which the CGEvent typing in insert.rs already did.
tauri = { version = "2", features = [
  "tray-icon",
  "image-png",
  "macos-private-api",
] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-window-state = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Microphone capture. Cannot live in the webview: `getUserMedia` needs a secure
# context and the packaged app serves http://tauri.localhost.
cpal = "0.15"
# WAV encoding for the 16 kHz mono upload.
hound = "3.5"
# Groq HTTP. `native-tls` so we link Schannel instead of shipping a cert bundle.
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
  "json",
  "multipart",
] }
# GROQ_API_KEY, read only here — never handed to the webview.
dotenvy = "0.15"
# History timestamps.
# `parsing` so 4.2 can read the timestamps back out of the JSONL.
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# History entry ids.
uuid = { version = "1", features = ["v4"] }
# Copy on a history row. navigator.clipboard is unavailable in the packaged app:
# http://tauri.localhost is not a secure context.
tauri-plugin-clipboard-manager = "2"

# Only the `latency_ab` example needs a runtime of its own; the app itself uses
# Tauri's. Dev-only, so nothing here reaches a release build.
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The macOS half of platform.rs and insert.rs. All four already ship inside
# Tauri's own dependency tree at these versions, so this pins what is there
# rather than pulling anything new into the build.
objc2 = "0.6"
# NSScreen.visibleFrame for the work area, and NSPanel for the widget that must
# never activate. `NSPanel` alone does not compile — the type is declared behind
# NSResponder and NSWindow as well, because it inherits from both.
objc2-app-kit = { version = "0.3", features = [
  "NSScreen",
  "NSEvent",
  "NSPanel",
  "NSWindow",
  "NSResponder",
] }
# CGEvent for typing, plus the cursor, key and modifier state the menu polls.
objc2-core-graphics = { version = "0.3", features = [
  "CGEvent",
  "CGEventSource",
  "CGEventTypes",
  # CGKeyCode, which CGEventCreateKeyboardEvent takes.
  "CGRemoteOperation",
] }

[target.'cfg(windows)'.dependencies]
# SendInput for typing, and the window flags that stop the widget taking focus.
windows = { version = "0.62", features = [
  "Win32_Foundation",
  # GetMonitorInfoW, for the work area the widget sits in.
  "Win32_Graphics_Gdi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  # GetCurrentProcessId, to tell Piplo's own windows from the user's app before
  # synthesising a correction.
  "Win32_System_Threading",
] }

# Keeps the shipped binary small.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
